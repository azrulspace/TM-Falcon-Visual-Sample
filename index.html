<!DOCTYPE html>
<html lang="en" class="theme_dark dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FALCON Operations Console</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("ds_theme"); } catch (e) {}
        if (!t) t = "dark";
        document.documentElement.classList.remove("theme_light", "theme_dark", "dark");
        document.documentElement.classList.add("theme_" + t);
        if (t === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
